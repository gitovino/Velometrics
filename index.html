function rmtReady(){return typeof Sync!=='undefined'&&!!Sync.cfg}
function rmtErr(e){const m=(e&&e.message)||String(e);return /Onbekende actie/i.test(m)?'Je Google Apps Script is nog een oudere versie zonder “telefoon als scanner”. Vervang Code.gs door de nieuwe versie en maak een nieuwe versie van de implementatie (Implementeren › Implementaties beheren › ✎ › Nieuwe versie).':m}
async function rmtCall(action,extra,ms){try{return await Sync.call(action,extra,null,ms||25000)}catch(e){const x=new Error(rmtErr(e));x.code=e.code;throw x}}
function rmtNeedLink(){return 'Koppel eerst dit toestel én je telefoon aan dezelfde Google Sheet (Instellingen › Synchronisatie). De scans gaan via je eigen Google-script.'}
/* ---------- Tablet ---------- */
A.rmtHost=async()=>{if(!rmtReady())throw new Error(rmtNeedLink());if(RMT.role==='phone')throw new Error('Dit toestel is nu zelf scanner voor een ander toestel. Stop dat eerst.');
  if(RMT.role!=='host'){const j=await rmtCall('rsOpen',{});Object.assign(RMT,{role:'host',id:j.id,pin:j.pin,after:0,last:Date.now(),queue:[],phone:'',fails:0});rmtPoll(600);rmtBar()}
  openModal({title:'📱 Scannen met je telefoon',gid:'dialog-rmt-host',body:rmtHostBody,foot:()=>'<button type="button" class="btn danger ghost" data-act="rmtStop">Koppeling stoppen</button><button type="button" class="btn primary" data-act="closeModal">Verder werken</button>'});setTimeout(rmtDrawQR,30)};
function rmtUrl(){const l=typeof location!=='undefined'?location:{};return String(l.origin&&l.origin!=='null'?l.origin+l.pathname:String(l.href||'').split('#')[0])+'#/scanner?remote='+encodeURIComponent(RMT.id)}
function rmtHostBody(){return '<div class="rmt-host"><div id="rmt-qr" class="rmt-qr" aria-label="QR-code om je telefoon te koppelen">QR-code laden…</div><div class="grow"><ol class="small" style="margin:0 0 10px;padding-left:18px;line-height:1.5">'+
  '<li>Richt de camera van je telefoon op deze QR-code en open de link, <b>of</b> open Provisio op je telefoon › Scanner › <b>📱 Scanner voor ander toestel</b> en kies dit toestel.</li>'+
  '<li>Scan barcodes of fotografeer etiketten op je telefoon. Ze komen hier binnen enkele seconden binnen.</li><li>Staat hier al een venster open, dan wachten de scans netjes op hun beurt.</li></ol>'+
  '<div class="rmt-pin">Code <b class="mono">'+esc(RMT.pin)+'</b></div><div class="small" id="rmt-st" style="margin-top:8px">'+rmtStatusTxt()+'</div></div></div>'+
  '<div class="hint" style="margin-top:10px">Werkt via je eigen Google-script; er wordt niets in je Sheet bewaard. Beide toestellen moeten gekoppeld zijn aan dezelfde Google Sheet. <b>iPhone:</b> staat Provisio op je beginscherm, gebruik dan de knop in de app zelf (een QR-link opent in Safari, dat niet gekoppeld is).</div>'}
function rmtStatusTxt(){return RMT.phone?'✓ <b>'+esc(RMT.phone)+'</b> is verbonden'+(RMT.queue.length?' · '+plural(RMT.queue.length,'scan wacht','scans wachten'):''):'⏳ Wacht op je telefoon…'}
async function rmtDrawQR(){const el=$('#rmt-qr');if(!el||!RMT.id)return;try{await loadScript(RMT_QR);if(!window.qrcode)throw new Error('geen QR');const q=window.qrcode(0,'M');q.addData(rmtUrl());q.make();const svg=q.createSvgTag(4,2);const b=$('#rmt-qr');if(b)b.innerHTML=svg.replace(/width="\d+px"/,'width="100%"').replace(/height="\d+px"/,'height="100%"')}
  catch(e){const b=$('#rmt-qr');if(b)b.innerHTML='<div class="small muted" style="padding:10px">QR-code niet beschikbaar (offline?). Gebruik op je telefoon de knop <b>📱 Scanner voor ander toestel</b> en de code hiernaast.</div>'}}
function rmtPoll(ms){clearTimeout(RMT.timer);if(RMT.role!=='host')return;RMT.timer=setTimeout(rmtTick,ms==null?2000:ms)}
async function rmtTick(){if(RMT.role!=='host')return;if(typeof document!=='undefined'&&document.hidden){rmtPoll(5000);return}
  if(Date.now()-RMT.last>30*60000){rmtEnd('De scankoppeling met je telefoon is gestopt na 30 minuten zonder scans.');return}
  try{const j=await rmtCall('rsPull',{id:RMT.id,after:RMT.after});RMT.fails=0;
    if(j.phone&&j.phone!==RMT.phone){RMT.phone=j.phone;toast('📱 '+j.phone+' is verbonden als scanner.')}
    (j.items||[]).forEach(it=>{if(it.n<=RMT.after)return;RMT.after=it.n;RMT.queue.push(it);RMT.last=Date.now()});
    rmtDrain();rmtBar();rmtPoll(j.more?300:2000)}
  catch(e){if(e.code==='gone'){rmtEnd('De scankoppeling is verlopen. Start ze opnieuw als je verder wil scannen met je telefoon.');return}RMT.fails++;rmtBar();rmtPoll(Math.min(30000,2000*Math.pow(2,RMT.fails)))}}
function rmtTop(){return Modals.length?Modals[Modals.length-1]:null}
function rmtFormOpen(){const t=rmtTop();return !!(t&&(t.gid==='dialog-confirm-product'||t.gid==='dialog-nutrition'))}
/* Volgende scan uit de wachtrij behandelen (foto's mogen in een open formulier, barcodes wachten tot alles dicht is). */
function rmtDrain(){if(RMT.role!=='host'||!RMT.queue.length||RMT.busy)return;const it=RMT.queue[0];const t=rmtTop();
  if(t&&t.gid==='dialog-rmt-host'){closeModal();return}
  if(it.kind==='photo'){if(t&&!rmtFormOpen())return;RMT.queue.shift();rmtPhoto(it);return}
  if(t)return;RMT.queue.shift();rmtCode(it);rmtBar()}
function rmtCode(it){const code=String(it.code||'').trim();if(!code)return;toast('📱 Van '+(it.from||'je telefoon')+': '+code);
  if(it.mode==='add')return lookupBarcode(code,'telefoon',true);
  if(it.mode==='take'||it.mode==='count'){if(!M.findProductByBarcode(code))return lookupBarcode(code,'telefoon',true);outScan(code,'telefoon',{tab:it.mode==='count'?'count':'take'});if(OUT)OUT.chosen=true;paintModal();return}
  return lookupBarcode(code,'telefoon')}
async function rmtPhoto(it){if(it.lost||!it.image){toast('Een foto van je telefoon is onderweg verloren gegaan. Neem ze opnieuw.','error');return}
  RMT.busy=true;try{const url='data:'+(it.mime||'image/jpeg')+';base64,'+it.image;toast('📱 Foto ontvangen ('+(RMT_PURPOSE[it.purpose]||'foto')+') — lezen…');const canvas=await dataUrlToCanvas(url,2000);
    if(!rmtFormOpen())openConfirm({source:'telefoon',info:'Foto ontvangen van '+(it.from||'je telefoon')+'. Controleer en vul aan.'},UI.view==='scanner'?'scanner':'inline');
    const t=rmtTop();
    if(it.purpose==='verpakking'){if(t.gid==='dialog-confirm-product')await cfOcrFrom(canvas);else toast('Een verpakkingsfoto past niet in dit venster — sluit het eerst.','error')}
    else{if(t.gid==='dialog-confirm-product'&&CF&&!CF.nut){CF.nut=nutState(CF.pref.health)}const st=t.gid==='dialog-nutrition'&&NE?NE.st:CF&&CF.nut;if(!st){toast('Dit product heeft al voedingsgegevens uit Open Food Facts.');return}st.open=true;NUT=st;await nutRead(url,canvas,it.purpose==='ingredienten'?'ingredienten':'voeding',st)}}
  catch(e){toast(e.message||String(e),'error')}finally{RMT.busy=false;setTimeout(rmtDrain,300)}}
function rmtEnd(msg){clearTimeout(RMT.timer);const had=RMT.role==='host';Object.assign(RMT,{role:'',id:'',pin:'',queue:[],phone:''});rmtBar();if(had&&msg)toast(msg);const t=rmtTop();if(t&&t.gid==='dialog-rmt-host')closeModal();if(UI.view==='scanner')scheduleRender()}
A.rmtStop=async()=>{const id=RMT.id,role=RMT.role;clearTimeout(RMT.stimer);if(role==='host'){rmtEnd('');toast('Scankoppeling met je telefoon gestopt.');try{await Sync.call('rsClose',{id},null,15000)}catch(e){}}else if(role==='phone')A.rmtLeave()};

  const s=$('#rmt-st');if(s)s.innerHTML=rmtStatusTxt()}catch(e){}}

function ageOpts(cur){const o=[['','— leeftijd —'],[0,'jonger dan 1 jaar']];for(let i=1;i<=17;i++)o.push([i,i+' jaar']);return sel(cur==null?'':cur,o)}
function householdSection(){const st=M.settings();const h=M.household();const kids=h.children;
  let x='<div class="field" style="margin-top:12px"><label for="hh-adults">Volwassenen</label><input id="hh-adults" class="inp" type="number" min="0" max="12" inputmode="numeric" value="'+h.adults+'" data-change="hhAdults" style="max-width:120px"></div>';
  x+='<div class="lbl" style="margin:16px 0 6px">Kinderen'+(kids.length?' ('+kids.length+')':'')+'</div>';
  if(kids.length)x+='<div class="list" data-glean-id="hh-kids">'+kids.map((k,i)=>'<div class="li" data-glean-id="hh-kid-'+esc(k.id)+'"><div class="thumb" aria-hidden="true">'+(k.age!=null&&k.age<4?'👶':'🧒')+'</div><div class="grow" style="min-width:0"><div class="row" style="gap:8px"><input class="inp" style="flex:1;min-width:120px" placeholder="Naam (optioneel)" aria-label="Naam kind '+(i+1)+'" value="'+esc(k.name)+'" data-change="hhKidName" data-id="'+esc(k.id)+'"><select class="inp" style="width:auto" aria-label="Leeftijd kind '+(i+1)+'" data-change="hhKidAge" data-id="'+esc(k.id)+'">'+ageOpts(k.age)+'</select></div><div class="sub-t" style="margin-top:4px">'+(k.portion?'Eet ≈ '+fmtNum(k.portion)+' portie ('+esc(kidBand(k.age))+')':'Eet nog niet mee met de gewone maaltijden')+(k.age>=18?' · telt nu als volwassene':'')+'</div></div><div class="acts"><button type="button" class="btn sm ghost" data-act="hhKidDel" data-id="'+esc(k.id)+'" aria-label="Verwijder '+esc(k.name||'kind '+(i+1))+'">Verwijder</button></div></div>').join('')+'</div>';
  else x+='<div class="empty" style="padding:8px 0">Nog geen kinderen toegevoegd.</div>';
  if(kids.length<10)x+='<div class="row" style="margin-top:8px;gap:8px"><select id="hh-new-age" class="inp" style="width:auto" aria-label="Leeftijd nieuw kind">'+ageOpts(null)+'</select><input id="hh-new-name" class="inp" style="flex:1;min-width:140px" placeholder="Naam (optioneel)" aria-label="Naam nieuw kind" data-enter="hhKidAdd"><button type="button" class="btn" data-act="hhKidAdd">+ Kind toevoegen</button></div>';
  x+='<div class="card" style="margin-top:16px;padding:12px 16px" data-glean-id="hh-portions"><label class="check"><input type="checkbox" data-change="hhAuto" '+(st.portionsAuto!==false?'checked':'')+'> Porties automatisch berekenen voor recepten en weekmenu</label>';
  if(st.portionsAuto!==false)x+='<div style="margin-top:8px;font-size:16px;line-height:24px"><b>'+fmtNum(h.computed)+' porties</b> <span class="muted small">= '+h.adults+' × 1'+(kids.length?' + '+kids.map(k=>fmtNum(k.portion)).join(' + '):'')+(Math.abs(h.adults+h.kidSum-h.computed)>0.001?' (afgerond)':'')+'</span></div>';
  else x+='<div class="field" style="margin-top:8px"><label>Standaard aantal porties</label><input class="inp" type="number" min="1" max="20" step="0.5" value="'+esc(st.servings)+'" data-change="setNum" data-path="servings" style="max-width:120px"></div>';
  x+='<div class="hint" style="margin-top:8px">Een kind eet minder dan een volwassene: 1–3 jaar ≈ 0,4 · 4–6 jaar ≈ 0,55 · 7–10 jaar ≈ 0,7 · 11–13 jaar ≈ 0,85 · vanaf 14 jaar 1 portie. Jonger dan 1 jaar telt niet mee. De leeftijd loopt vanzelf elk jaar op. In een recept kun je het aantal porties altijd nog aanpassen.</div></div>';
  return x}
function kidList(){return (M.settings().children||[]).map(k=>Object.assign({},k))}
A.hhAdults=(d,el)=>{let v=Math.round(Number(el.value));if(!isFinite(v)||v<0)v=0;if(v>12)v=12;if(v===0&&!kidList().length){toast('Er moet minstens één persoon in het huishouden zijn.','error');render();return}M.saveSettings({adults:v});render();toast('Opgeslagen: '+v+(v===1?' volwassene.':' volwassenen.'))};
A.hhKidAdd=()=>{const a=$('#hh-new-age'),n=$('#hh-new-name');const age=a&&a.value!==''?Number(a.value):null;if(age==null||!isFinite(age))throw new Error('Kies eerst de leeftijd van het kind.');const name=((n&&n.value)||'').trim().slice(0,40);
  const kids=kidList();if(kids.length>=10)throw new Error('Maximaal 10 kinderen.');kids.push({id:'kid-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,birth:birthFromAge(age)});
  const patch={children:kids};if(M.settings().adults==null)patch.adults=M.household().adults;M.saveSettings(patch);if(a)a.value='';if(n)n.value='';render();toast((name||'Kind')+' ('+(age===0?'< 1 jaar':age+' jaar')+') toegevoegd. Recepten rekenen nu met '+fmtNum(M.household().servings)+' porties.')};
A.hhKidAge=(d,el)=>{if(el.value==='')return;const kids=kidList();const k=kids.find(x=>x.id===d.id);if(!k)return;k.birth=birthFromAge(Number(el.value));M.saveSettings({children:kids});render();toast('Leeftijd aangepast.')};
A.hhKidName=(d,el)=>{const kids=kidList();const k=kids.find(x=>x.id===d.id);if(!k)return;k.name=String(el.value||'').trim().slice(0,40);M.saveSettings({children:kids});toast('Opgeslagen.')};
A.hhKidDel=d=>{const kids=kidList();const k=kids.find(x=>x.id===d.id);if(!k)return;const rest=kids.filter(x=>x.id!==d.id);if(!rest.length&&!M.household().adults)throw new Error('Er moet minstens één persoon in het huishouden zijn.');M.saveSettings({children:rest});render();
  toast((k.name||'Kind')+' verwijderd.','',{label:'Ongedaan maken',fn:()=>{M.saveSettings({children:kids});render()}})};
A.hhAuto=(d,el)=>{const patch={portionsAuto:!!el.checked};if(el.checked&&M.settings().adults==null)patch.adults=M.household().adults;if(!el.checked)patch.servings=M.household().computed;M.saveSettings(patch);render();toast(el.checked?'Porties worden automatisch berekend: '+fmtNum(M.household().servings)+'.':'Je stelt het aantal porties nu zelf in.')};

const Reminders={timer:null,
  start(){this.tick();this.timer=setInterval(()=>this.tick(),60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.tick()})},
  can(){return M.settings().reminders.browser&&'Notification' in window&&Notification.permission==='granted'},
  send(title,body,tag){try{const n=new Notification(title,{body,tag,lang:'nl'});n.onclick=()=>{try{window.focus()}catch(e){}A.notifs();n.close()}}catch(e){}},
  tick(){if(!M||!this.can())return;const st=M.settings(),r=st.reminders;const now=new Date();const today=todayStr();const hm=pad(now.getHours())+':'+pad(now.getMinutes());const all=M.buildNotifications();
    if(r.daily&&hm>=r.dailyTime&&LS.get('lastDaily','')!==today){LS.set('lastDaily',today);const c=t=>all.filter(n=>n.type===t).length;const wd=(now.getDay()+6)%7;
      const parts=[c('expired')&&c('expired')+' vervallen',c('soon')&&c('soon')+' vervalt binnenkort',c('low')+c('empty')&&(c('low')+c('empty'))+' bijna/volledig op',Object.keys(M.S.shopping).length+' op je boodschappenlijst'].filter(Boolean);
      this.send('Voorraad vandaag',parts.join(' · ')+(r.weekly&&wd===Number(r.weeklyDay)?' · Tijd voor de wekelijkse voorraadcontrole.':''),'svb-daily')}
    const sent=LS.get('notified',{});const fresh=all.filter(n=>['expired','soon','low','empty'].includes(n.type)&&(r.minStock||!['low','empty'].includes(n.type))&&!sent[n.key]);
    if(fresh.length){if(fresh.length<=3)fresh.forEach(n=>this.send(n.title,n.text,n.key));else this.send(fresh.length+' nieuwe voorraadmeldingen',fresh.slice(0,4).map(n=>n.title).join('\n'),'svb-batch');fresh.forEach(n=>sent[n.key]=today);
      const keep={};const keys=new Set(all.map(n=>n.key));Object.keys(sent).forEach(k=>{if(keys.has(k))keep[k]=sent[k]});LS.set('notified',keep)}}};

/* ---------- Voorbeelddata opsporen en verwijderen ---------- */
const DEMO_SIG=new Set(["Rundergehakt|Slager", "Kipfilet|Delhaize", "Spaghetti|Barilla", "Tomatenpuree|Boni", "Passata|Mutti", "Halfvolle melk|Inza", "Eieren|Boni", "Griekse yoghurt|Danone", "Geraspte kaas|Everyday", "Gekookte hesp|Herta", "Wortelen|", "Uien|", "Aardappelen|", "Basmatirijst|Lassie", "Kokosmelk|Santa Maria", "Rode currypasta|Santa Maria", "Diepvrieserwten|Iglo", "Zalmfilet|", "Restje groentesoep|", "Oregano|Verstegen", "Paprikapoeder|Ducros", "Melkchocolade|Côte d'Or", "Speculoos|Lotus", "Bananen|", "Volkorenbrood|", "Boter|Président", "Bloem|Everyday"]);
const DEMO_WIN=120000;
function findDemo(M){
  const t=x=>{const v=Date.parse(x||'');return isNaN(v)?null:v};
  const cand=M.products().filter(p=>DEMO_SIG.has((p.name||'')+'|'+(p.brand||'')));
  const empty={products:[],keep:[],lots:[],history:[],shopping:[],count:0};
  if(!cand.length)return empty;
  let marks=Object.values(M.S.history).filter(h=>h.action==='voorbeeld').map(h=>t(h.ts)).filter(v=>v!=null);
  if(!marks.length){/* geen markering: zoek een cluster van minstens 20 voorbeeldproducten die binnen 2 minuten zijn aangemaakt */
    const ts=cand.map(p=>t(p.createdAt)).filter(v=>v!=null).sort((a,b)=>a-b);
    for(let i=0;i<ts.length;i++){const n=ts.filter(v=>v>=ts[i]&&v<=ts[i]+DEMO_WIN).length;if(n>=20){marks=[ts[i]+DEMO_WIN/2];break}}}
  if(!marks.length)return empty;
  const near=x=>{const v=t(x);return v!=null&&marks.some(m=>Math.abs(v-m)<=DEMO_WIN)};
  const prods=cand.filter(p=>near(p.createdAt));if(!prods.length)return empty;
  const pids=new Set(prods.map(p=>p.id));const allLots=Object.values(M.S.lots).filter(l=>pids.has(l.productId));
  const lots=allLots.filter(l=>near(l.createdAt));const realPids=new Set(allLots.filter(l=>!near(l.createdAt)).map(l=>l.productId));
  const remove=prods.filter(p=>!realPids.has(p.id)),keep=prods.filter(p=>realPids.has(p.id));
  const rp=new Set(remove.map(p=>p.id)),lids=new Set(lots.map(l=>l.id));
  const history=Object.values(M.S.history).filter(h=>h.action==='voorbeeld'||rp.has(h.productId)||(h.lotId&&lids.has(h.lotId)));
  const shopping=Object.values(M.S.shopping).filter(s=>rp.has(s.productId));
  return {products:remove,keep,lots,history,shopping,count:remove.length+lots.length};
}
function removeDemo(M){const d=findDemo(M);if(!d.count)return d;
  M.tx(()=>{d.lots.forEach(l=>M.del('lots',l.id));d.shopping.forEach(s=>M.del('shopping',s.id));d.history.forEach(h=>M.del('history',h.id));d.products.forEach(p=>M.del('products',p.id))});
  d.keep.forEach(p=>{try{M.checkMinStock(p.id)}catch(e){}});return d}
function demoBanner(){const d=findDemo(M);if(!d.count)return '';
  return '<div class="note warn" style="margin-bottom:16px" data-glean-id="demo-banner"><b>Er staat nog voorbeelddata in je voorraad</b> ('+plural(d.products.length+d.keep.length,'product','producten')+', '+plural(d.lots.length,'partij','partijen')+'). Verwijder ze voordat je met je echte voorraad werkt; producten die je zelf hebt toegevoegd blijven staan.<div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-act="removeDemo">Voorbeelddata verwijderen</button></div></div>'}
A.removeDemo=()=>{const d=findDemo(M);if(!d.count){toast('Er staat geen voorbeelddata meer in je voorraad.');render();return}
  const keepTxt=d.keep.length?' '+plural(d.keep.length,'voorbeeldproduct blijft','voorbeeldproducten blijven')+' staan omdat je er zelf partijen aan toevoegde ('+d.keep.map(p=>p.name).join(', ')+'); alleen de voorbeeldpartijen ervan worden verwijderd.':'';

const A11y={def:{size:'m',contrast:false,big:false,motion:false,speak:false,speakToasts:false,rate:1},

  canSpeak(){return typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined'},
  voice(){try{const vs=speechSynthesis.getVoices()||[];return vs.find(v=>/^nl[-_]BE/i.test(v.lang))||vs.find(v=>/^nl[-_]NL/i.test(v.lang))||vs.find(v=>/^nl/i.test(v.lang))||null}catch(e){return null}},
  speak(text,force){const o=A11y.get();if((!force&&!o.speak)||!text||!A11y.canSpeak())return false;

  if(p.unknownBarcode)parts.push('Onbekend product. Barcode staat niet in de databank. Je kunt de verpakking laten lezen of de gegevens zelf invullen.');

<script>
(function(){
  if(window.GleanBridge&&window.GleanBridge.postMessage){
    window.GleanBridge.postMessage({actionId:'export-pdf',type:'glean-add-menu',metadata:{label:'Export as PDF',icon:'export'}});
    window.GleanBridge.onMessage('action',function(data){if(data.actionId==='export-pdf')window.print();});
  }
  function prepareChartsForPrint(){if(!window.echarts)return;document.querySelectorAll('[_echarts_instance_]').forEach(function(el){var chart=echarts.getInstanceByDom(el);if(!chart)return;var img=new Image();img.src=chart.getDataURL({type:'png',pixelRatio:2});img.className='print-chart-img';img.style.cssText='width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:10;';el.dataset.prevPosition=el.style.position;el.style.position='relative';el.appendChild(img);});}
  function cleanUpAfterPrint(){document.querySelectorAll('.print-chart-img').forEach(function(img){var el=img.parentNode;img.remove();el.style.position=el.dataset.prevPosition||'';delete el.dataset.prevPosition;});}
  window.addEventListener('beforeprint',prepareChartsForPrint);window.addEventListener('afterprint',cleanUpAfterPrint);
})();
</script>
</body>
</html>
